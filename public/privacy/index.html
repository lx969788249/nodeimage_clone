  <h1>隐私协议</h1>
  <p>账户与图片记录存储在数据目录的 SQLite 数据库 <code>data/db.sqlite</code> 中，图片文件存储在 <code>uploads/</code> 目录。管理员配置 S3 兼容存储或 Webhook 后，备份会包含账户记录及图片，并发送到配置的服务。公开图片链接可由获得链接的人访问。请向站点管理员了解备份目标、保留期限及删除政策。</p>
  <p>使用过程中如有疑问，欢迎反馈。</p>
